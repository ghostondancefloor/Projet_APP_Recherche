version: "3.9"

services:
  mongo:
    build:
      context: .
      dockerfile: mongo.Dockerfile
    container_name: research_db_container
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db  # Named volume for persistent data storage
    networks:
      - internal_network
    env_file:
      - .env
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    deploy:
      resources:
        limits:
          cpus: '2.0'       # Maximum 2 CPU cores
          memory: 2G        # Maximum 2GB RAM
        reservations:
          cpus: '0.5'       # Minimum 0.5 CPU cores
          memory: 512M      # Minimum 512MB RAM

  api:
    build:
      context: ./api
    container_name: api_service
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - mongo
    networks:
      - internal_network
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
    deploy:
      resources:
        limits:
          cpus: '1.0'       # Maximum 1 CPU core
          memory: 1G        # Maximum 1GB RAM
        reservations:
          cpus: '0.25'      # Minimum 0.25 CPU cores
          memory: 256M      # Minimum 256MB RAM

  streamlit:
    build:
      context: ./streamlit
    container_name: streamlit_service
    restart: always
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      - api
    networks:
      - internal_network
    env_file:
      - .env
    environment:
      - API_BASE_URL=${API_BASE_URL}
    deploy:
      resources:
        limits:
          cpus: '1.5'       # Maximum 1.5 CPU cores
          memory: 1.5G      # Maximum 1.5GB RAM
        reservations:
          cpus: '0.25'      # Minimum 0.25 CPU cores
          memory: 256M      # Minimum 256MB RAM

  # ==========================================================================
  # MONITORING STACK
  # ==========================================================================

  # MongoDB Exporter - Exposes MongoDB metrics for Prometheus
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb_exporter
    restart: always
    ports:
      - "${MONGODB_EXPORTER_PORT:-9216}:9216"
    command:
      - '--mongodb.uri=mongodb://mongo:27017'
      - '--collect-all'
      - '--compatible-mode'
    depends_on:
      - mongo
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      - api
      - mongodb-exporter
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:

networks:
  internal_network:
    driver: bridge