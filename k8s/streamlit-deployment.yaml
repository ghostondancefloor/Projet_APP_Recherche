# Streamlit Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: research-dashboard
  labels:
    app: streamlit
spec:
  replicas: 2  # 2 replicas for high availability
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      containers:
      - name: streamlit
        image: projet_app_recherche-streamlit:latest
        imagePullPolicy: Never  # Use local image
        ports:
        - containerPort: 8501
          name: http
        env:
        - name: API_BASE_URL
          value: "http://api-service:8000"
        # Streamlit server timeouts (in seconds)
        - name: STREAMLIT_SERVER_HEADLESS
          value: "true"
        - name: STREAMLIT_SERVER_RUN_ON_SAVE
          value: "false"
        - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
          value: "false"
        resources:
          limits:
            cpu: "2"
            memory: "3Gi"  # Increased for AI models (BART + T5 + embeddings)
          requests:
            cpu: "0.5"
            memory: "1.5Gi"  # Minimum for AI models
        livenessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 5
---
# Streamlit Service - Exposed to external traffic via NodePort
apiVersion: v1
kind: Service
metadata:
  name: streamlit-service
  namespace: research-dashboard
  labels:
    app: streamlit
spec:
  type: NodePort  # Exposes to network for multi-host access
  # SESSION AFFINITY: Keep same user on same pod (important for AI model caching)
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 hour - user stays on same pod
  ports:
  - port: 8501
    targetPort: 8501
    nodePort: 30501  # Fixed port accessible from any device on network
    protocol: TCP
    name: http
  selector:
    app: streamlit
