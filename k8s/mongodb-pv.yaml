# PersistentVolume - Storage for MongoDB data
# Works on both Docker Desktop (Mac/Windows) and standard K8s
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
  labels:
    type: local
spec:
  storageClassName: hostpath  # Compatible with Docker Desktop
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data/mongodb"  # Local path for data storage
---
# PersistentVolumeClaim - Request for storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: research-dashboard
spec:
  storageClassName: hostpath  # Must match PV storageClassName
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: mongodb-pv  # Explicitly bind to our PV
