apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  namespace: research-dashboard
  labels:
    app: mongodb-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-exporter
  template:
    metadata:
      labels:
        app: mongodb-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9216"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.40.0
          args:
            - "--mongodb.uri=mongodb://mongodb-service:27017"
            - "--collect-all"
            - "--compatible-mode"
          ports:
            - containerPort: 9216
              name: metrics
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 9216
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 9216
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-exporter-service
  namespace: research-dashboard
  labels:
    app: mongodb-exporter
spec:
  type: ClusterIP
  ports:
    - port: 9216
      targetPort: 9216
      protocol: TCP
      name: metrics
  selector:
    app: mongodb-exporter
