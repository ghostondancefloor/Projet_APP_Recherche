# Kubernetes Secret for sensitive data
# NOTE: In production, use proper secret management (Vault, Sealed Secrets, etc.)
# For learning, we'll use base64 encoded values

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
data:
  # jwt-secret-key: Base64 encoded value of "your-secret-key-change-in-production"
  # To generate: echo -n "your-secret-key-change-in-production" | base64
  jwt-secret-key: eW91ci1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u
  
  # mongo-password: Base64 encoded value of "your-mongo-password"
  # To generate: echo -n "your-mongo-password" | base64
  mongo-password: eW91ci1tb25nby1wYXNzd29yZA==
